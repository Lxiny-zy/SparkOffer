<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- SparkOffer mascot — static favicon derived from CatAvatar.tsx.
       Colors track the app's light (ginger) / dark (purple) themes via
       prefers-color-scheme so the tab matches whichever the browser uses. -->
  <style>
    :root{--body:#F5A623;--bodyL:#FFEAA7;--eye:#2D3436;--nose:#E17055;--ear:#FF7675;--whisker:#636E72}
    @media (prefers-color-scheme: dark){
      :root{--body:#9373D1;--bodyL:#C9B8E8;--eye:#E8DEFF;--nose:#EFB8C8;--ear:#EFB8C8;--whisker:#A89DB8}
    }
  </style>
  <!-- Tail -->
  <path d="M44 52Q54 48 56 38Q58 34 54 32" stroke="var(--body)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <ellipse cx="32" cy="52" rx="14" ry="9" fill="var(--body)"/>
  <ellipse cx="32" cy="54" rx="9" ry="5" fill="var(--bodyL)" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="32" cy="30" rx="22" ry="18" fill="var(--body)"/>
  <ellipse cx="32" cy="34" rx="14" ry="10" fill="var(--bodyL)" opacity="0.5"/>
  <!-- Ears -->
  <path d="M12 24Q6 14 14 8Q20 12 26 18Z" fill="var(--body)"/>
  <path d="M14 22Q9 15 15 10Q19 13 24 18Z" fill="var(--ear)" opacity="0.6"/>
  <path d="M52 24Q58 14 50 8Q44 12 38 18Z" fill="var(--body)"/>
  <path d="M50 22Q55 15 49 10Q45 13 40 18Z" fill="var(--ear)" opacity="0.6"/>
  <!-- Eyes (happy ^_^) -->
  <path d="M20 28C20 28 23 25 26 28" stroke="var(--eye)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M38 28C38 28 41 25 44 28" stroke="var(--eye)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="13" cy="34" r="4" fill="var(--ear)" opacity="0.4"/>
  <circle cx="51" cy="34" r="4" fill="var(--ear)" opacity="0.4"/>
  <!-- Nose -->
  <path d="M30 36L32 38.5L34 36Z" fill="var(--nose)"/>
  <!-- Mouth -->
  <path d="M28 40C28 40 30 42 32 40" stroke="var(--nose)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M32 40C32 40 34 42 36 40" stroke="var(--nose)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Whiskers -->
  <g opacity="0.5" stroke="var(--whisker)" stroke-width="0.8">
    <line x1="4" y1="32" x2="16" y2="34"/>
    <line x1="4" y1="38" x2="16" y2="36"/>
    <line x1="48" y1="34" x2="60" y2="32"/>
    <line x1="48" y1="36" x2="60" y2="38"/>
  </g>
</svg>
