# Loaded inside the public ingress's server block via an extension include.
# The public ingress is a second proxy in front of the frontend container, so
# its timeout and buffering policy must also be SSE-aware.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;

    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_connect_timeout 30s;
    proxy_read_timeout 720s;
    proxy_send_timeout 720s;
    proxy_buffering off;
    proxy_cache off;
}
