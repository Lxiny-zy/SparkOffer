services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest        # 建议生产环境 pin 具体版本，如 :v1.12.0
    ports:
      - "6333:6333"                     # REST / HTTP API
      - "6334:6334"                     # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    # qdrant/qdrant 基于 distroless，无 shell/curl —— 无法配 exec healthcheck。
    # backend 是 qdrant-only（VECTOR_BACKEND=qdrant 时不降级 numpy）：连不上时
    # 检索降级为空上下文并委派后台重建，服务本身不崩，故不强制等它 healthy。

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9001:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # 向量后端默认 qdrant（KB + 记忆库都走同进程外的 Qdrant，消除大索引进程内冷加载）。
      # 仍可在 .env 覆盖：设 VECTOR_BACKEND=numpy 退回本地。
      - VECTOR_BACKEND=${VECTOR_BACKEND:-qdrant}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "9000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
